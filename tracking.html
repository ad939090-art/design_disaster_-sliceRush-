<!DOCTYPE html>
<html>
<head>
<title>Track Order</title>

<style>

body{
font-family:Arial;
margin:0;
background:linear-gradient(lightblue,white);
text-align:center;
}

/* LOGO */

.logo{
position:absolute;
top:10px;
left:10px;
background:red;
color:white;
padding:10px;
font-size:22px;
font-weight:bold;
}

/* TITLE */

.title{
margin-top:80px;
font-size:40px;
color:black;
}

/*STATUS BOX */

.status{
margin-top:40px;
display:inline-block;
background:yellow;
border:5px dashed red;
padding:25px;
font-size:18px;
width:320px;
}


/*PROGRESS BAR*/

.progress{
margin-top:20px;
height:25px;
width:80%;
background:gray;
margin-left:auto;
margin-right:auto;
}

.bar{
height:100%;
width:63%;
background:lime;
}

/*TEXT*/

.notes{
margin-top:20px;
color:red;
font-weight:bold;
}

/*BACK BUTTON*/

.back{
display:block;
margin-top:40px;
font-size:20px;
}

</style>
</head>

<body>

<div class="logo">
SliceRush 🍕
</div>

<div class="title">
TRACK YOUR ORDER
</div>

<div class="status">

 Preparing Food 11.11 %<br><br>
 Looking for Driver 22.22%<br><br>
 Driver Found 44.44%<br><br>
 Driver Lost 55.55%<br><br>
 Driver Found Again 66.66%<br><br>
 Driver Asking For Address 77.77%<br><br>
 Driver Took Break 88.88%<br><br>
 Maybe Arriving Soon… 99.99%

</div>

<div class="progress">
<div class="bar"></div>
</div>

<div class="notes">
Progress bar may not be accurate....
</div>

<a class="back" href="sliceRushMain.html">⬅ Go Back</a>

</body>
</html>
