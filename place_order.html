<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SliceRush 🍕</title>
<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:Segoe UI,sans-serif;
  background:linear-gradient(135deg,#ff6b6b,#ffc93c);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px;
}
.logo{
  position:fixed;
  top:15px;
  left:20px;
  background:#e63946;
  color:white;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  font-size:20px;
}
.container{
  background:white;
  width:100%;
  max-width:520px;
  padding:25px;
  border-radius:16px;
  box-shadow:0 10px 35px rgba(0,0,0,0.25);
  margin-top:80px;
}
h2{text-align:center;color:#e63946;margin-top:0;}
.offer{text-align:center;font-size:22px;font-weight:bold;color:#e63946;}
.tiny{text-align:center;font-size:12px;margin-bottom:15px;color:#777;}
label{font-weight:600;font-size:14px;}
select,input[type=number]{width:100%;padding:10px;margin:6px 0 14px;border-radius:6px;border:1px solid #ccc;font-size:14px;}
button{
  width:100%;
  padding:12px;
  background:#e63946;
  color:white;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  transition:0.2s;
}
button:hover{background:#c72c3a;}
#mealsContainer{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;}
.meal-card{border:1px solid #ccc;border-radius:10px;padding:10px;text-align:center;}
.meal-card img{width:80px;height:80px;border-radius:8px;}
.cart{background:#f7f7f7;padding:10px;border-radius:8px;margin-top:10px;font-size:14px;}
.cart-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.cart-item button{width:auto;padding:3px 8px;font-size:12px;background:#c72c3a;}
.hidden{display:none;}
.popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;padding:20px;}
.popup-content{background:white;padding:25px;border-radius:10px;text-align:center;max-width:300px;width:100%;}
.help{
  position:fixed;
  bottom:20px;
  right:20px;
  width:auto;
  padding:10px 16px;      /* slightly bigger than before */
  font-size:14px;         /* bigger font for visibility */
  border-radius:8px;      /* smoother corners */
  background:#e63946;     /* red background */
  color:white;            /* text color */
  font-weight:bold;       /* make text stand out */
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.3); /* subtle shadow for visibility */
  transition:0.2s;
}
.help:hover{
  background:#c72c3a;     /* darker red on hover */
}
@media(max-width:480px){#mealsContainer{grid-template-columns:1fr;}}


/* BACK BUTTON */

.back{
display:inline-block;
margin-top:30px;
background:#2c2c2c;
color:white;
padding:10px 20px;
text-decoration:none;
border-radius:6px;
}

.back:hover{
background:#444;
}


</style>
</head>
<body>

<div class="logo">SliceRush 🍕</div>

<div class="container" id="orderPage">
  <div class="offer">🔥 40% OFF Today</div>
  <div class="tiny">Orders above ₹499</div>

  <h2>Order Food</h2>

  <label>State</label>
  <select id="state" onchange="updateCities()"><option value="">Select State</option></select>

  <label>City</label>
  <select id="city"><option>Select City</option></select>

  <label>Restaurant</label>
  <select id="restaurant" onchange="loadMeals()">
    <option value="">Select Restaurant</option>
    <option>Pizza Corner</option>
    <option>The Quantum Diner</option>
    <option>Wingdings</option>
  </select>

  <label>Category</label>
  <select id="category" onchange="loadMeals()">
    <option value="">Select Category</option>
    <option>Main Course</option>
    <option>Sides</option>
    <option>Desserts</option>
    <option>Drinks</option>
  </select>

  <div id="mealsContainer"></div>

  <div class="cart" id="cartBox"><b>Cart</b><br>No items yet</div>

  <button onclick="goToPayment()">Place Order</button>
  <a class="back" href="sliceRushMain.html">⬅ Back to Home</a>
</div>

<div class="container hidden" id="paymentPage">
  <h2>Payment</h2>
  <div id="paymentSummary"></div>
  <label>Payment Method</label>
  <select>
    <option>UPI</option>
    <option>Credit Card</option>
    <option>Debit Card</option>
    <option>Cash on Delivery</option>
  </select>
  <button onclick="completePayment()">Pay Now</button>
</div>

<button class="help" onclick="openHelp()">Help</button>
<div id="popup" class="popup">
  <div class="popup-content">
    <h3>Need Help?</h3>
    <p>Email support@slicerush.com</p>
    <button onclick="closeHelp()">Close</button>
  </div>
</div>


<script>
// ---------- READ COUPON FROM URL ----------
const urlParams = new URLSearchParams(window.location.search);
const appliedCoupon = urlParams.get("coupon");
if(appliedCoupon){
  alert("Coupon applied: " + appliedCoupon);
  // You can store it in a global variable for later discount calculation
  window.appliedCouponCode = appliedCoupon;
}

// ---------- COUPONS ----------
const coupons = {
  "PIZZA40": {discount: 40, minOrder: 499},
  "TECH20": {discount: 20, minOrder: 1000},
  "CAKE30": {discount: 30, minOrder: 299},
  "COFFEE10": {discount: 10, minOrder: 150},
  "FASH50": {discount: 50, minOrder: 1999}
};

// ---------- STATES & CITIES ----------
const stateCities = {
"Andhra Pradesh":["Visakhapatnam","Vijayawada","Guntur","Tirupati"],
"Arunachal Pradesh":["Itanagar","Tawang","Pasighat"],
"Assam":["Guwahati","Silchar","Dibrugarh","Tezpur"],
"Bihar":["Patna","Gaya","Bhagalpur","Muzaffarpur"],
"Chhattisgarh":["Raipur","Bhilai","Bilaspur","Durg"],
"Goa":["Panaji","Margao","Vasco da Gama","Mapusa"],
"Gujarat":["Ahmedabad","Surat","Vadodara","Rajkot"],
"Haryana":["Gurgaon","Faridabad","Panipat","Ambala"],
"Himachal Pradesh":["Shimla","Manali","Dharamshala","Solan"],
"Jharkhand":["Ranchi","Jamshedpur","Dhanbad","Bokaro"],
"Karnataka":["Bangalore","Mysore","Mangalore","Hubli","Belgaum"],
"Kerala":["Kochi","Thiruvananthapuram","Kozhikode","Thrissur"],
"Madhya Pradesh":["Bhopal","Indore","Gwalior","Jabalpur"],
"Maharashtra":["Mumbai","Pune","Nagpur","Nashik","Aurangabad"],
"Manipur":["Imphal","Thoubal","Churachandpur"],
"Meghalaya":["Shillong","Tura","Jowai"],
"Mizoram":["Aizawl","Lunglei","Champhai"],
"Nagaland":["Kohima","Dimapur","Mokokchung"],
"Odisha":["Bhubaneswar","Cuttack","Rourkela","Puri"],
"Punjab":["Ludhiana","Amritsar","Jalandhar","Patiala"],
"Rajasthan":["Jaipur","Udaipur","Jodhpur","Kota"],
"Sikkim":["Gangtok","Namchi","Gyalshing"],
"Tamil Nadu":["Chennai","Coimbatore","Madurai","Salem","Tiruchirappalli"],
"Telangana":["Hyderabad","Warangal","Nizamabad","Karimnagar"],
"Tripura":["Agartala","Udaipur","Dharmanagar"],
"Uttar Pradesh":["Lucknow","Kanpur","Varanasi","Agra","Noida"],
"Uttarakhand":["Dehradun","Haridwar","Nainital","Roorkee"],
"West Bengal":["Kolkata","Howrah","Durgapur","Siliguri"],
"Delhi":["New Delhi","Dwarka","Rohini","Janakpuri"]
};

function populateStates(){
  const stateDropdown=document.getElementById("state");
  Object.keys(stateCities).forEach(state=>{
    const opt=document.createElement("option");
    opt.text=state;
    stateDropdown.add(opt);
  });
}
function updateCities(){
  const state=document.getElementById("state").value;
  const cityDropdown=document.getElementById("city");
  cityDropdown.innerHTML="<option>Select City</option>";
  if(stateCities[state]){
    stateCities[state].forEach(city=>{
      const opt=document.createElement("option");
      opt.text=city;
      cityDropdown.add(opt);
    });
  }
}

// ---------- MEALS DATA ----------

const pizzaMenu = {
  "Main Course":[
    {name:"Margherita Pizza",price:249,img:"images/PIZZA-MARGHERITA.jpeg"},
    {name:"Pepperoni Pizza",price:329,img:"images/pepperoni pizza.jpeg"},
    {name:"Farmhouse Pizza",price:289,img:"images/farmhouse pizza.jpeg"},
    {name:"Paneer Tikka Pizza",price:299,img:"images/paneer tikka pizza.jpeg"},
    {name:"Veg Supreme Pizza",price:309,img:"images/veg supreme pizza.jpeg"},
    {name:"BBQ Chicken Pizza",price:349,img:"images/bbq chicken pizza.jpeg"},
    {name:"Cheese Burst Pizza",price:369,img:"images/cheese burst pizza.jpeg"},
    {name:"Mexican Green Wave",price:319,img:"images/mexican green wave.jpeg"},
    {name:"Paneer Makhani Pizza",price:339,img:"images/paneer makhani.jpeg"},
    {name:"Deluxe Veggie Pizza",price:309,img:"images/deluxe veggie.jpeg"}
  ],

  "Sides":[
    {name:"Garlic Bread",price:99,img:"images/garlic bread.jpeg"},
    {name:"French Fries",price:79,img:"images/french fries.jpeg"},
    {name:"Onion Rings",price:89,img:"images/onion rings.jpeg"},
    {name:"Stuffed Breadsticks",price:99,img:"images/stuffed breadsticks.jpeg"},
    {name:"Chicken Wings",price:149,img:"images/chicken wings.jpeg"}
  ],

  "Desserts":[
    {name:"Chocolate Cake",price:119,img:"images/chocolate cake.jpeg"},
    {name:"Brownie",price:129,img:"images/brownie.jpeg"},
    {name:"Ice Cream",price:99,img:"images/ice cream.jpeg"},
    {name:"Cupcake",price:89,img:"images/cupcake.jpeg"},
    {name:"Cookie",price:49,img:"images/cookie.jpeg"}
  ],

  "Drinks":[
    {name:"Coke",price:49,img:"images/coke.jpeg"},
    {name:"Pepsi",price:49,img:"images/pepsi.jpeg"},
    {name:"Lemonade",price:39,img:"images/lemonade.jpeg"},
    {name:"Cold Coffee",price:99,img:"images/cold coffee.jpeg"},
    {name:"Iced Tea",price:59,img:"images/iced tea.jpeg"}
  ]
};

const mealsData = {
  "Pizza Corner": pizzaMenu,
  "The Quantum Diner": pizzaMenu,
  "Wingdings": pizzaMenu
};

// ---------- CART ----------
let cart=[];
let total=0;
let currentRestaurant="";

function loadMeals() {
  const restaurant = document.getElementById("restaurant").value;
  const category = document.getElementById("category").value;
  const container = document.getElementById("mealsContainer");
  container.innerHTML = "";

  if (!mealsData[restaurant] || !mealsData[restaurant][category]) return;

  mealsData[restaurant][category].forEach(meal => {
    const div = document.createElement("div");
    div.className = "meal-card";
    div.innerHTML = `
      <img src="${meal.img}" alt="${meal.name}">
      <p>${meal.name} - ₹${meal.price}</p>
      <input type="number" min="1" value="1" id="qty-${meal.name.replace(/\s/g,'')}">
      <button onclick="addToCart('${meal.name}','${meal.price}','${restaurant}')">Add</button>
    `;
    container.appendChild(div);
  });
}

function addToCart(name,price,restaurant){
  if(cart.length>0 && restaurant!==currentRestaurant){
    alert("⚠️ You can only order from one restaurant at a time!");
    return;
  }
  const qty=parseInt(document.getElementById(`qty-${name.replace(/\s/g,'')}`).value);
  const itemTotal=price*qty;
  cart.push({name,qty,price,itemTotal});
  currentRestaurant=restaurant;
  updateCart();
}

function removeItem(index){
  cart.splice(index,1);
  if(cart.length===0) currentRestaurant="";
  updateCart();
}

function updateCart(){
  const cartBox = document.getElementById("cartBox");
  if(cart.length === 0){
    cartBox.innerHTML = "<b>Cart</b><br>No items yet";
    total = 0;
    return;
  }

  total = 0;
  cartBox.innerHTML = "<b>Cart</b><br>";
  
  cart.forEach((item,i)=>{
    total += item.itemTotal;
    cartBox.innerHTML += `<div class="cart-item">${item.name} x${item.qty} = ₹${item.itemTotal} <button onclick="removeItem(${i})">Remove</button></div>`;
  });

  let finalTotal = total;

  // Apply coupon if valid
  if(window.appliedCouponCode && coupons[window.appliedCouponCode]){
    const coupon = coupons[window.appliedCouponCode];
    if(total >= coupon.minOrder){
      const discountAmount = (total * coupon.discount) / 100;
      finalTotal = total - discountAmount;
      cartBox.innerHTML += `<div style="color:green;"><b>Coupon (${window.appliedCouponCode}) applied: -₹${discountAmount.toFixed(2)}</b></div>`;
    } else {
      cartBox.innerHTML += `<div style="color:red;"><b>Coupon (${window.appliedCouponCode}) not applicable (min ₹${coupon.minOrder})</b></div>`;
    }
  }

  cartBox.innerHTML += `<b>Total: ₹${finalTotal.toFixed(2)}</b>`;
}

function goToPayment(){
  if(cart.length === 0){ alert("Cart is empty!"); return; }

  document.getElementById("orderPage").classList.add("hidden");
  document.getElementById("paymentPage").classList.remove("hidden");

  let summary = "";
  cart.forEach(item => {
    summary += `${item.name} x${item.qty} = ₹${item.itemTotal}<br>`;
  });

  let finalTotal = total;

  if(window.appliedCouponCode && coupons[window.appliedCouponCode]){
    const coupon = coupons[window.appliedCouponCode];
    if(total >= coupon.minOrder){
      const discountAmount = (total * coupon.discount) / 100;
      finalTotal = total - discountAmount;
      summary += `<div style="color:green;"><b>Coupon (${window.appliedCouponCode}) applied: -₹${discountAmount.toFixed(2)}</b></div>`;
    } else {
      summary += `<div style="color:red;"><b>Coupon (${window.appliedCouponCode}) not applicable (min ₹${coupon.minOrder})</b></div>`;
    }
  }

  summary += `<b>Total: ₹${finalTotal.toFixed(2)}</b>`;
  document.getElementById("paymentSummary").innerHTML = summary;
}

function completePayment(){
  alert("🎉 Order Successful! Your food is on the way.");
  window.location.href = "sliceRushMain.html";
}


// ---------- HELP POPUP ----------
function openHelp(){document.getElementById("popup").style.display="flex";}
function closeHelp(){document.getElementById("popup").style.display="none";}

// ---------- INIT ----------
populateStates();
</script>
</body>
</html>
